<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .bg { fill: #ffffff; }
    .step { fill: #f4f5f7; stroke: #8a929c; }
    .data { fill: #eaf1f9; stroke: #2a5a9a; }
    .sys { fill: #ffffff; stroke: #2a5a9a; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #4b535c; font-size: 12.5px; }
    .d { fill: #2a5a9a; font-size: 12.5px; }
    .lbl { fill: #656d76; font-size: 12px; font-style: italic; }
    .arrow { stroke: #4b535c; stroke-width: 1.6; fill: none; }
    .link { stroke: #2a5a9a; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #4b535c; }
    .headb { fill: #2a5a9a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1115; }
      .step { fill: #1a1d23; stroke: #5d6570; }
      .data { fill: #15202e; stroke: #8fb3e0; }
      .sys { fill: #0f1115; stroke: #8fb3e0; }
      .t { fill: #e6e6e6; }
      .s { fill: #b4bbc4; }
      .d, .lbl { fill: #8fb3e0; }
      .arrow { stroke: #b4bbc4; }
      .link { stroke: #8fb3e0; }
      .head { fill: #b4bbc4; }
      .headb { fill: #8fb3e0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headb" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="760" height="520"/>

  <!-- objective -->
  <rect class="step" x="70" y="16" width="330" height="50" rx="10"/>
  <text class="t" x="235" y="38" text-anchor="middle">Scientists</text>
  <text class="s" x="235" y="56" text-anchor="middle">set the objective, approve scale-ups</text>
  <path class="arrow" d="M235,66 L235,92" marker-end="url(#a)"/>

  <!-- steps -->
  <rect class="step" x="70" y="96" width="330" height="72" rx="10"/>
  <text class="t" x="88" y="122">1  Propose</text>
  <text class="s" x="88" y="141">Agents form new hypotheses</text>
  <text class="d" x="88" y="158">Data: mine past results</text>
  <path class="arrow" d="M235,168 L235,200" marker-end="url(#a)"/>
  <text class="lbl" x="245" y="189">hundreds of variants</text>

  <rect class="step" x="70" y="204" width="330" height="72" rx="10"/>
  <text class="t" x="88" y="230">2  Implement</text>
  <text class="s" x="88" y="249">Agents change code or data</text>
  <text class="d" x="88" y="266">Data: build candidate datasets</text>
  <path class="arrow" d="M235,276 L235,308" marker-end="url(#a)"/>
  <text class="lbl" x="245" y="297">small runs first</text>

  <rect class="step" x="70" y="312" width="330" height="72" rx="10"/>
  <text class="t" x="88" y="338">3  Run</text>
  <text class="s" x="88" y="357">Train, simulate or run the lab</text>
  <text class="d" x="88" y="374">Data: feed trainers and simulators</text>
  <path class="arrow" d="M235,384 L235,416" marker-end="url(#a)"/>
  <text class="lbl" x="245" y="405">results</text>

  <rect class="step" x="70" y="420" width="330" height="72" rx="10"/>
  <text class="t" x="88" y="446">4  Evaluate</text>
  <text class="s" x="88" y="465">Score candidates against the baseline</text>
  <text class="d" x="88" y="482">Data: per-slice deltas, ledger</text>

  <!-- loop back -->
  <path class="arrow" d="M70,456 L36,456 L36,132 L66,132" marker-end="url(#a)"/>
  <text class="lbl" x="28" y="300" text-anchor="middle" transform="rotate(-90 28 300)">next round</text>

  <!-- data layer -->
  <rect class="data" x="520" y="96" width="210" height="396" rx="12"/>
  <text class="t" x="625" y="126" text-anchor="middle">Shared data layer</text>
  <text class="s" x="625" y="150" text-anchor="middle">one plan representation</text>
  <text class="s" x="625" y="168" text-anchor="middle">and one cache for the loop</text>
  <rect class="sys" x="528" y="215" width="194" height="32" rx="8"/>
  <text class="d" x="625" y="236" text-anchor="middle">data preparation</text>
  <rect class="sys" x="528" y="261" width="194" height="32" rx="8"/>
  <text class="d" x="625" y="282" text-anchor="middle">model inference</text>
  <rect class="sys" x="528" y="307" width="194" height="32" rx="8"/>
  <text class="d" x="625" y="328" text-anchor="middle">training and simulation feeds</text>
  <rect class="sys" x="528" y="353" width="194" height="32" rx="8"/>
  <text class="d" x="625" y="374" text-anchor="middle">evaluation</text>
  <text class="s" x="625" y="440" text-anchor="middle">work done for one experiment</text>
  <text class="s" x="625" y="458" text-anchor="middle">is reused by every later one</text>

  <!-- data links -->
  <path class="link" d="M400,132 L516,180" marker-end="url(#b)"/>
  <path class="link" d="M400,240 L516,260" marker-end="url(#b)"/>
  <path class="link" d="M400,348 L516,340" marker-end="url(#b)"/>
  <path class="link" d="M400,456 L516,420" marker-end="url(#b)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
