<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .bg { fill: #ffffff; }
    .ext { fill: #f4f5f7; stroke: #8a929c; }
    .sys { fill: #eaf1f9; stroke: #2a5a9a; stroke-width: 1.4; }
    .tier { fill: #ffffff; stroke: #2a5a9a; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #4b535c; font-size: 12.5px; }
    .lbl { fill: #656d76; font-size: 12px; font-style: italic; }
    .arrow { stroke: #4b535c; stroke-width: 1.6; fill: none; }
    .head { fill: #4b535c; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1115; }
      .ext { fill: #1a1d23; stroke: #5d6570; }
      .sys { fill: #15202e; stroke: #8fb3e0; }
      .tier { fill: #0f1115; stroke: #8fb3e0; }
      .t { fill: #e6e6e6; }
      .s { fill: #b4bbc4; }
      .lbl { fill: #9aa1aa; }
      .arrow { stroke: #b4bbc4; }
      .head { fill: #b4bbc4; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" width="760" height="430"/>

  <!-- top row -->
  <rect class="ext" x="20" y="16" width="250" height="62" rx="10"/>
  <text class="t" x="145" y="42" text-anchor="middle">Agent loop</text>
  <text class="s" x="145" y="61" text-anchor="middle">proposers, implementers, evaluators</text>
  <rect class="ext" x="490" y="16" width="250" height="62" rx="10"/>
  <text class="t" x="615" y="42" text-anchor="middle">Model endpoints</text>
  <text class="s" x="615" y="61" text-anchor="middle">LLMs, classifiers, embedders</text>

  <!-- middle row -->
  <rect class="sys" x="20" y="130" width="250" height="110" rx="10"/>
  <text class="t" x="145" y="156" text-anchor="middle">Ember</text>
  <text class="s" x="145" y="177" text-anchor="middle">distributed DataFrame engine (C++)</text>
  <text class="s" x="145" y="195" text-anchor="middle">Axiom planner, Velox execution</text>
  <text class="s" x="145" y="213" text-anchor="middle">content-hashed stages, reuse</text>
  <text class="s" x="145" y="231" text-anchor="middle">model calls as expressions</text>

  <rect class="sys" x="330" y="130" width="190" height="110" rx="10"/>
  <text class="t" x="425" y="156" text-anchor="middle">Stoke</text>
  <text class="s" x="425" y="177" text-anchor="middle">queue of chunk ids</text>
  <text class="s" x="425" y="195" text-anchor="middle">backpressure</text>
  <text class="s" x="425" y="213" text-anchor="middle">PyTorch loader</text>

  <rect class="ext" x="580" y="130" width="160" height="110" rx="10"/>
  <text class="t" x="660" y="180" text-anchor="middle">Trainers</text>
  <text class="s" x="660" y="199" text-anchor="middle">GPUs / TPUs</text>

  <!-- arrows top -->
  <path class="arrow" d="M145,78 L145,126" marker-end="url(#a)"/>
  <text class="lbl" x="155" y="106">DataFrame jobs</text>
  <path class="arrow" d="M270,150 L300,150 L300,47 L486,47" marker-end="url(#a)"/>
  <text class="lbl" x="393" y="39" text-anchor="middle">model calls</text>
  <path class="arrow" d="M270,200 L326,200" marker-end="url(#a)"/>
  <text class="lbl" x="276" y="192">chunk ids</text>
  <path class="arrow" d="M520,185 L576,185" marker-end="url(#a)"/>
  <text class="lbl" x="526" y="177">batches</text>

  <!-- Kiln -->
  <rect class="sys" x="20" y="290" width="720" height="124" rx="12"/>
  <text class="t" x="380" y="315" text-anchor="middle">Kiln: tiered store for immutable, content-addressed chunks</text>
  <rect class="tier" x="60" y="334" width="200" height="62" rx="8"/>
  <text class="t" x="160" y="359" text-anchor="middle">DRAM</text>
  <text class="s" x="160" y="378" text-anchor="middle">one-sided RDMA, shm, TCP</text>
  <rect class="tier" x="280" y="334" width="200" height="62" rx="8"/>
  <text class="t" x="380" y="359" text-anchor="middle">Local disk</text>
  <text class="s" x="380" y="378" text-anchor="middle">overflow and spill</text>
  <rect class="tier" x="500" y="334" width="200" height="62" rx="8"/>
  <text class="t" x="600" y="359" text-anchor="middle">Object store</text>
  <text class="s" x="600" y="378" text-anchor="middle">durable, write-through</text>

  <!-- arrows to kiln -->
  <path class="arrow" d="M145,244 L145,286" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="155" y="270">shuffle, cached stages, datasets</text>
  <path class="arrow" d="M660,244 L660,286" marker-start="url(#a)"/>
  <text class="lbl" x="600" y="270" text-anchor="end">chunk reads</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
