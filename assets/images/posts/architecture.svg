<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .panel { fill: #f6f6f3; }
    .ext { fill: #ffffff; stroke: #dcdcd6; }
    .sys { fill: #e6eef8; stroke: #1f3a5f; stroke-width: 1.3; }
    .tier { fill: #ffffff; stroke: #c3d3e8; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .st { fill: #1f3a5f; font-size: 15px; font-weight: 600; }
    .s { fill: #626a73; font-size: 12.5px; }
    .lbl { fill: #8a8f96; font-size: 12px; }
    .arrow { stroke: #a3a8ae; stroke-width: 1.3; fill: none; }
    .head { fill: #a3a8ae; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #16191e; }
      .ext { fill: #1d2127; stroke: #2e343c; }
      .sys { fill: #17243a; stroke: #8fb3e0; }
      .tier { fill: #1d2127; stroke: #2e4a6e; }
      .t { fill: #e6e6e6; }
      .st { fill: #a9c6ea; }
      .s { fill: #a9b0b9; }
      .lbl { fill: #8b929b; }
      .arrow { stroke: #5f6670; }
      .head { fill: #5f6670; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0,1 L9,5 L0,9 z"/></marker>
  </defs>
  <rect class="panel" width="808" height="468" rx="18"/>

  <!-- top row -->
  <rect class="ext" x="24" y="24" width="260" height="62" rx="12"/>
  <text class="t" x="42" y="50">Agent loop</text>
  <text class="s" x="42" y="70">proposers, implementers, evaluators</text>
  <rect class="ext" x="524" y="24" width="260" height="62" rx="12"/>
  <text class="t" x="542" y="50">Model endpoints</text>
  <text class="s" x="542" y="70">LLMs, classifiers, embedders</text>

  <!-- middle row -->
  <rect class="sys" x="24" y="146" width="260" height="104" rx="12"/>
  <text class="st" x="42" y="174">Ember</text>
  <text class="s" x="42" y="194">distributed DataFrame engine</text>
  <text class="s" x="42" y="212">content-hashed stages, reuse</text>
  <text class="s" x="42" y="230">model calls as expressions</text>

  <rect class="sys" x="352" y="146" width="180" height="104" rx="12"/>
  <text class="st" x="370" y="174">Stoke</text>
  <text class="s" x="370" y="194">queue of chunk ids</text>
  <text class="s" x="370" y="212">backpressure</text>
  <text class="s" x="370" y="230">PyTorch loader</text>

  <rect class="ext" x="604" y="146" width="180" height="104" rx="12"/>
  <text class="t" x="622" y="174">Trainers</text>
  <text class="s" x="622" y="194">GPUs / TPUs</text>

  <!-- arrows -->
  <path class="arrow" d="M154,86 L154,142" marker-end="url(#a)"/>
  <text class="lbl" x="164" y="119">DataFrame jobs</text>
  <path class="arrow" d="M284,166 L318,166 L318,55 L520,55" marker-end="url(#a)"/>
  <text class="lbl" x="420" y="47" text-anchor="middle">model calls</text>
  <path class="arrow" d="M284,220 L348,220" marker-end="url(#a)"/>
  <text class="lbl" x="316" y="211" text-anchor="middle">chunk ids</text>
  <path class="arrow" d="M532,198 L600,198" marker-end="url(#a)"/>
  <text class="lbl" x="566" y="189" text-anchor="middle">batches</text>
  <path class="arrow" d="M154,254 L154,310" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="164" y="286">shuffle, cached stages, datasets</text>
  <path class="arrow" d="M694,254 L694,310" marker-start="url(#a)"/>
  <text class="lbl" x="684" y="286" text-anchor="end">chunk reads</text>

  <!-- Kiln -->
  <rect class="sys" x="24" y="314" width="760" height="130" rx="14"/>
  <text x="42" y="342"><tspan class="st">Kiln</tspan><tspan class="s" dx="10">tiered store for immutable, content-addressed chunks</tspan></text>
  <rect class="tier" x="42" y="358" width="236" height="66" rx="10"/>
  <text class="t" x="58" y="384">DRAM</text>
  <text class="s" x="58" y="404">one-sided RDMA, shm, TCP</text>
  <rect class="tier" x="286" y="358" width="236" height="66" rx="10"/>
  <text class="t" x="302" y="384">Local disk</text>
  <text class="s" x="302" y="404">overflow and spill</text>
  <rect class="tier" x="530" y="358" width="236" height="66" rx="10"/>
  <text class="t" x="546" y="384">Object store</text>
  <text class="s" x="546" y="404">durable, write-through</text>
</svg>
