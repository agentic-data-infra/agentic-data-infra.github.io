<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .panel { fill: #f6f6f3; }
    .node { fill: #ffffff; stroke: #dcdcd6; }
    .pill { fill: #ffffff; stroke: #dcdcd6; }
    .band { fill: #e6eef8; stroke: #1f3a5f; stroke-width: 1.3; }
    .chip { fill: #ffffff; stroke: #c3d3e8; }
    .num { fill: #8a8f96; font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.08em; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #626a73; font-size: 12.5px; }
    .bt { fill: #1f3a5f; font-size: 14px; font-weight: 600; }
    .bs { fill: #4b5d75; font-size: 12.5px; }
    .ct { fill: #1f3a5f; font-size: 12.5px; }
    .lbl { fill: #8a8f96; font-size: 12px; }
    .arrow { stroke: #a3a8ae; stroke-width: 1.3; fill: none; }
    .data { stroke: #1f3a5f; stroke-width: 1.3; fill: none; }
    .head { fill: #a3a8ae; }
    .headd { fill: #1f3a5f; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #16191e; }
      .node, .pill { fill: #1d2127; stroke: #2e343c; }
      .band { fill: #17243a; stroke: #8fb3e0; } .chip { fill: #1d2127; stroke: #2e4a6e; } .bt, .ct { fill: #c3d6ef; }
      .t { fill: #e6e6e6; }
      .s { fill: #a9b0b9; }
      .bs { fill: #c3d3e8; }
      .arrow { stroke: #5f6670; }
      .data { stroke: #8fb3e0; }
      .head { fill: #5f6670; }
      .headd { fill: #8fb3e0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0,1 L9,5 L0,9 z"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="headd" d="M0,1 L9,5 L0,9 z"/></marker>
  </defs>
  <rect class="panel" width="808" height="372" rx="18"/>

  <!-- objective -->
  <rect class="pill" x="24" y="18" width="370" height="32" rx="16"/>
  <text x="40" y="39"><tspan class="t" font-size="13">Scientists</tspan><tspan class="s" dx="8">set the objective, approve scale-ups</tspan></text>
  <path class="arrow" d="M70,50 L70,98" marker-end="url(#a)"/>

  <!-- next round -->
  <path class="arrow" d="M698,102 L698,76 L150,76 L150,98" marker-end="url(#a)"/>
  <text class="lbl" x="424" y="68" text-anchor="middle">next round</text>

  <!-- steps -->
  <rect class="node" x="24" y="102" width="172" height="90" rx="12"/>
  <text class="num" x="40" y="124">01</text>
  <text class="t" x="40" y="146">Propose</text>
  <text class="s" x="40" y="166">Agents form new</text>
  <text class="s" x="40" y="182">hypotheses</text>

  <rect class="node" x="220" y="102" width="172" height="90" rx="12"/>
  <text class="num" x="236" y="124">02</text>
  <text class="t" x="236" y="146">Implement</text>
  <text class="s" x="236" y="166">Agents change code</text>
  <text class="s" x="236" y="182">or data</text>

  <rect class="node" x="416" y="102" width="172" height="90" rx="12"/>
  <text class="num" x="432" y="124">03</text>
  <text class="t" x="432" y="146">Run</text>
  <text class="s" x="432" y="166">Train, simulate or</text>
  <text class="s" x="432" y="182">run the lab</text>

  <rect class="node" x="612" y="102" width="172" height="90" rx="12"/>
  <text class="num" x="628" y="124">04</text>
  <text class="t" x="628" y="146">Evaluate</text>
  <text class="s" x="628" y="166">Score candidates</text>
  <text class="s" x="628" y="182">against the baseline</text>

  <path class="arrow" d="M196,147 L216,147" marker-end="url(#a)"/>
  <path class="arrow" d="M392,147 L412,147" marker-end="url(#a)"/>
  <path class="arrow" d="M588,147 L608,147" marker-end="url(#a)"/>

  <!-- data arrows -->
  <path class="data" d="M110,196 L110,242" marker-start="url(#d)" marker-end="url(#d)"/>
  <path class="data" d="M306,196 L306,242" marker-start="url(#d)" marker-end="url(#d)"/>
  <path class="data" d="M502,196 L502,242" marker-start="url(#d)" marker-end="url(#d)"/>
  <path class="data" d="M698,196 L698,242" marker-start="url(#d)" marker-end="url(#d)"/>

  <!-- shared data layer -->
  <rect class="band" x="24" y="246" width="760" height="106" rx="14"/>
  <rect class="chip" x="36" y="258" width="148" height="34" rx="8"/>
  <text class="ct" x="110" y="280" text-anchor="middle">mine past results</text>
  <rect class="chip" x="232" y="258" width="148" height="34" rx="8"/>
  <text class="ct" x="306" y="280" text-anchor="middle">build datasets</text>
  <rect class="chip" x="428" y="258" width="148" height="34" rx="8"/>
  <text class="ct" x="502" y="280" text-anchor="middle">feed trainers</text>
  <rect class="chip" x="624" y="258" width="148" height="34" rx="8"/>
  <text class="ct" x="698" y="280" text-anchor="middle">per-slice deltas</text>
  <text x="40" y="330"><tspan class="bt">Shared data layer</tspan><tspan class="bs" dx="10">one plan representation and one cache, reused by every later experiment</tspan></text>
</svg>
