<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 492" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .panel { fill: #f6f6f3; }
    .ext { fill: #ffffff; stroke: #dcdcd6; }
    .sys { fill: #e6eef8; stroke: #1f3a5f; stroke-width: 1.3; }
    .tier { fill: #ffffff; stroke: #c3d3e8; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .tt { fill: #1f2328; font-size: 13.5px; font-weight: 600; }
    .st { fill: #1f3a5f; font-size: 15px; font-weight: 600; }
    .sst { fill: #1f3a5f; font-size: 13.5px; font-weight: 600; }
    .s { fill: #626a73; font-size: 12.5px; }
    .lbl { fill: #8a8f96; font-size: 12px; }
    .arrow { stroke: #a3a8ae; stroke-width: 1.3; fill: none; }
    .dash { stroke-dasharray: 4 3; }
    .head { fill: #a3a8ae; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #16191e; }
      .ext { fill: #1d2127; stroke: #2e343c; }
      .sys { fill: #17243a; stroke: #8fb3e0; }
      .tier { fill: #1d2127; stroke: #2e4a6e; }
      .t, .tt { fill: #e6e6e6; }
      .st, .sst { fill: #a9c6ea; }
      .s { fill: #a9b0b9; }
      .lbl { fill: #8b929b; }
      .arrow { stroke: #5f6670; }
      .head { fill: #5f6670; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0,1 L9,5 L0,9 z"/></marker>
  </defs>
  <rect class="panel" width="808" height="492" rx="18"/>

  <!-- Ember job -->
  <rect class="sys" x="24" y="24" width="236" height="316" rx="14"/>
  <text class="st" x="42" y="52">Ember job</text>
  <text class="s" x="42" y="71">one DataFrame program</text>
  <rect class="tier" x="40" y="86" width="204" height="74" rx="10"/>
  <text class="tt" x="54" y="110">Worker</text>
  <text class="s" x="54" y="129">read, filter, join, pack</text>
  <text class="s" x="54" y="147">batch-aware sink</text>
  <rect class="tier" x="40" y="170" width="204" height="74" rx="10"/>
  <text class="tt" x="54" y="194">Worker</text>
  <text class="s" x="54" y="213">read, filter, join, pack</text>
  <text class="s" x="54" y="231">batch-aware sink</text>
  <rect class="tier" x="40" y="254" width="204" height="74" rx="10"/>
  <text class="tt" x="54" y="278">Worker</text>
  <text class="s" x="54" y="297">read, filter, join, pack</text>
  <text class="s" x="54" y="315">batch-aware sink</text>

  <!-- Stoke shards -->
  <rect class="sys" x="336" y="112" width="168" height="132" rx="12"/>
  <text class="st" x="352" y="140">Stoke shards</text>
  <text class="s" x="352" y="162">queue of chunk ids</text>
  <text class="s" x="352" y="181">leases, dedupe</text>
  <text class="s" x="352" y="200">task budget</text>

  <!-- Trainers -->
  <rect class="ext" x="584" y="24" width="200" height="98" rx="12"/>
  <text class="t" x="600" y="50">Trainer rank 0</text>
  <rect class="sys" x="598" y="62" width="172" height="46" rx="9"/>
  <text class="sst" x="612" y="82">Stoke loader</text>
  <text class="s" x="612" y="99">zero-copy tensors</text>
  <rect class="ext" x="584" y="133" width="200" height="98" rx="12"/>
  <text class="t" x="600" y="159">Trainer rank 1</text>
  <rect class="sys" x="598" y="171" width="172" height="46" rx="9"/>
  <text class="sst" x="612" y="191">Stoke loader</text>
  <text class="s" x="612" y="208">zero-copy tensors</text>
  <rect class="ext" x="584" y="242" width="200" height="98" rx="12"/>
  <text class="t" x="600" y="268">Trainer rank N</text>
  <rect class="sys" x="598" y="280" width="172" height="46" rx="9"/>
  <text class="sst" x="612" y="300">Stoke loader</text>
  <text class="s" x="612" y="317">zero-copy tensors</text>

  <!-- arrows: Ember to shards, shards to loaders -->
  <path class="arrow" d="M260,160 L332,160" marker-end="url(#a)"/>
  <text class="lbl" x="298" y="151" text-anchor="middle">chunk ids</text>
  <path class="arrow dash" d="M336,212 L264,212" marker-end="url(#a)"/>
  <text class="lbl" x="298" y="230" text-anchor="middle">wait</text>
  <path class="arrow" d="M504,160 L540,160 L540,85 L594,85" marker-end="url(#a)"/>
  <path class="arrow" d="M540,160 L540,194 L594,194" marker-end="url(#a)"/>
  <path class="arrow" d="M540,194 L540,303 L594,303" marker-end="url(#a)"/>
  <text class="lbl" x="548" y="153">take</text>

  <!-- arrows: Ember to Kiln, Kiln to loaders -->
  <path class="arrow" d="M142,340 L142,380" marker-end="url(#a)"/>
  <text class="lbl" x="152" y="364">write batches into chunks</text>
  <path class="arrow" d="M684,384 L684,344" marker-end="url(#a)"/>
  <text class="lbl" x="674" y="364" text-anchor="end">read whole chunks</text>

  <!-- Kiln -->
  <rect class="sys" x="24" y="384" width="760" height="84" rx="14"/>
  <text x="42" y="412"><tspan class="st">Kiln</tspan><tspan class="s" dx="10">batch bytes only: shared memory on the same host, one-sided RDMA across hosts</tspan></text>
  <rect class="tier" x="42" y="424" width="236" height="30" rx="8"/>
  <text class="s" x="58" y="444">DRAM server, host 1</text>
  <rect class="tier" x="286" y="424" width="236" height="30" rx="8"/>
  <text class="s" x="302" y="444">DRAM server, host 2</text>
  <rect class="tier" x="530" y="424" width="236" height="30" rx="8"/>
  <text class="s" x="546" y="444">DRAM server, host N</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
